<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="nakoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <filter id="shadowNako" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="48" fill="#F0FDF4"/>
  <circle cx="120" cy="120" r="102" fill="url(#nakoGrad)" filter="url(#shadowNako)"/>
  <circle cx="120" cy="120" r="95" stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- Icon: Geometric Nako Glass Louvres + Coffee Cup -->
  <g transform="translate(120, 92)">
    <!-- Glass Louver Angled Lines (Nako style) -->
    <rect x="-38" y="-38" width="76" height="52" rx="6" stroke="#4ADE80" stroke-width="2" fill="#14532D" fill-opacity="0.6"/>
    <line x1="-38" y1="-22" x2="38" y2="-22" stroke="#4ADE80" stroke-width="1.5"/>
    <line x1="-38" y1="-6" x2="38" y2="-6" stroke="#4ADE80" stroke-width="1.5"/>
    <line x1="-38" y1="6" x2="38" y2="6" stroke="#4ADE80" stroke-width="1.5"/>

    <!-- Steaming Coffee Cup -->
    <path d="M-18 2 L18 2 L14 26 C14 30 10 34 0 34 C-10 34 -14 30 -14 26 Z" fill="#FFFFFF"/>
    <!-- Cup Handle -->
    <path d="M16 8 C22 8 26 13 26 18 C26 23 22 26 15 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Steam waves -->
    <path d="M-6 -10 C-4 -6 -8 -2 -6 2" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M4 -12 C6 -8 2 -4 4 0" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="120" y="163" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="3" fill="#FFFFFF">KOPI NAKO</text>
  <text x="120" y="182" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" letter-spacing="4" fill="#86EFAC">CSB MALL</text>
  <text x="120" y="198" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="2" fill="#BBF7D0">KAFE &amp; MINUMAN • CIREBON</text>
</svg>
