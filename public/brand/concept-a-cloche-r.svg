<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="clocheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="256" height="256" rx="48" fill="#042f2e" />

  <!-- Monogram R with Cloche Dome & Food Warmth -->
  <g transform="translate(28, 24)">
    <!-- Cloche Top Handle (Dome Finial) -->
    <circle cx="120" cy="32" r="10" fill="url(#amberGrad)" />
    
    <!-- Vertical Stem of R (Solid Culinary Column) -->
    <path d="M 40 44 C 40 37.37 45.37 32 52 32 L 72 32 C 78.63 32 84 37.37 84 44 L 84 164 C 84 170.63 78.63 176 72 176 L 52 176 C 45.37 176 40 170.63 40 164 Z" fill="url(#clocheGrad)" />

    <!-- Cloche Dome as R Bowl (Upper Arch) -->
    <path d="M 84 46 C 84 46 100 32 128 32 C 165.55 32 188 56.5 188 88 C 188 116.5 163.5 136 126 136 L 84 136 Z" fill="none" stroke="url(#clocheGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cloche Inner Plate Rim Accent -->
    <path d="M 76 136 L 140 136" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Leg of R (Organic Sprout / Leaf Tail) -->
    <path d="M 112 126 L 152 168 C 158 174 166.5 176 175 176 L 180 176 C 183 176 185 172.5 183 170 C 172 156 160 142 148 126 Z" fill="url(#amberGrad)" />

    <!-- Steam Aromatics / Warm Flavor Dots -->
    <circle cx="128" cy="80" r="7" fill="#fef3c7" />
    <circle cx="152" cy="74" r="5" fill="#fef3c7" />
  </g>
</svg>
