<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Squircle Tile -->
  <rect width="512" height="512" rx="104" fill="#0c2e29" />

  <g transform="translate(0, 0)">
    <!-- 1. Left Vertical Stem of P/R -->
    <rect x="96" y="96" width="86" height="308" rx="43" fill="#139668" />

    <!-- 2. Main Green Bowl / Head Profile (P-Loop) -->
    <path
      d="M 139 96 
         L 290 96 
         C 386 96 450 148 450 236 
         C 450 324 386 356 290 356 
         L 139 356 
         Z"
      fill="#0f855b"
    />

    <!-- Overlapping Foreground Blend on Left Stem -->
    <rect x="96" y="96" width="86" height="260" rx="43" fill="#139668" />

    <!-- 3. Negative Space Counter (Face Profile) -->
    <path
      d="M 218 156 
         L 282 156 
         C 342 156 376 186 376 236 
         C 376 286 342 298 282 298 
         L 218 298 
         C 202 298 190 286 190 270 
         L 190 184 
         C 190 168 202 156 218 156 Z"
      fill="#0c2e29"
    />

    <!-- 4. Expressive Eyes (Two Cream Dots) -->
    <!-- Left Eye (Larger) -->
    <circle cx="298" cy="216" r="15" fill="#fff1c8" />
    <!-- Right Eye (Smaller, Higher) -->
    <circle cx="348" cy="202" r="11" fill="#fff1c8" />

    <!-- 5. Orange Duck/Platypus Bill as the Leg of 'R' -->
    <path
      d="M 276 356 
         L 352 356 
         C 358 356 364 360 368 365 
         L 426 405 
         C 434 411 430 423 420 423 
         L 396 423 
         C 388 423 380 419 374 412 
         L 316 356 
         Z"
      fill="#e58318"
    />
    <!-- Solid Wedge Beak Body -->
    <path
      d="M 278 356 
         L 354 356 
         L 424 406 
         C 430 411 427 421 418 421 
         L 384 421 
         C 376 421 368 416 362 409 
         L 278 356 Z"
      fill="#e58318"
    />
  </g>
</svg>
